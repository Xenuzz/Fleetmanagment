name: Mobile E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  mobile-playwright-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      
      - name: Run mobile tests
        run: npx playwright test --config=tests/playwright-mobile.config.ts
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30

  mobile-android-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run Android tests (Pixel 6)
        run: npx playwright test --config=tests/playwright-mobile.config.ts --project="Mobile Pixel 6"
        
      - name: Upload Android results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            test-results/
            playwright-report/
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        
      - name: Generate HTML Test Report
        run: npx playwright show-report test-results/ 2>&1 | tee report-output.txt
        shell: bash
        
      - name: Upload test summary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-summary
          path: |
            test-results/
            playwright-report/
            report-output.txt